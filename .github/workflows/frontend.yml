name: Frontend contract

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout latest backend contract
        uses: actions/checkout@v4
        with:
          repository: SE-FCaps-Tool/f-caps-schedule-be
          ref: main
          path: .contract-be
          fetch-depth: 1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Compare generated API contract
        shell: bash
        run: |
          backend=.contract-be/apps/api/openapi.json
          frontend=lib/api/generated/openapi.json
          if cmp -s "$backend" "$frontend"; then
            echo "FE generated contract matches BE main."
          else
            echo "::error file=$frontend::FE generated openapi.json differs from BE main. Run npm run typegen and commit the generated contract."
            echo "BE SHA256: $(sha256sum "$backend" | cut -d' ' -f1)"
            echo "FE SHA256: $(sha256sum "$frontend" | cut -d' ' -f1)"
            exit 1
          fi
